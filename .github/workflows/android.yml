name: App Android (SEMATEC Aula)

# Compila la app de Android y la publica en la versión «app-android» del repositorio.
# Se ejecuta cuando cambia la carpeta android/ o a mano (Actions → App Android → Run workflow).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  # Semanal: mantiene viva la clave de firma guardada en la caché (si no hay secretos de firma)
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Firma estable sin secretos: la clave se guarda en la caché privada de Actions (no en el código),
      # así las actualizaciones se instalan encima sin desinstalar.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sematec-firma-android-v1

      # Opcional: firma propia desde los secretos del repositorio (ANDROID_KEYSTORE_B64, …).
      - name: Preparar la firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sematec.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sematec.jks" >> "$GITHUB_ENV"
          else
            echo "Firma con la clave guardada en la caché de Actions."
          fi

      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || 'https://sematec-academy-3.vercel.app' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk sematec-aula.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sematec-aula
          path: sematec-aula.apk

      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-android >/dev/null 2>&1 || gh release create app-android --title "App Android SEMATEC Aula" --notes "Instale sematec-aula.apk en su celular Android para compartir la pantalla en las clases." --latest=false
          gh release upload app-android sematec-aula.apk --clobber
          gh release edit app-android --notes "Versión 1.0.${{ github.run_number }} · $(date -u +%Y-%m-%d). Instale sematec-aula.apk en su celular Android (Android 8 o superior) para compartir la pantalla en las clases."
