<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1430;color:#fff;padding:24px;box-sizing:border-box}
  .card{max-width:420px;background:#fff;color:#0f172a;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  h1{font-size:22px;margin:12px 0 8px} p{color:#475569;line-height:1.5;font-size:15px}
  ul{padding-left:18px;color:#334155;font-size:14px;line-height:1.7} a{color:#1f45c8;font-weight:600}
  button{margin-top:12px;background:#1f45c8;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
  #pages a{display:block}
</style>
</head>
<body>
<div class="card">
  <img src="/app-icon/192" onerror="this.src='/icons/icon-192.png'" width="56" height="56" alt="" style="border-radius:12px">
  <h1>📴 Está sin conexión</h1>
  <p>Esta página aún no estaba guardada en su dispositivo. Puede abrir las que ya visitó:</p>
  <div id="pages"><p style="font-size:14px">Buscando páginas guardadas…</p></div>
  <p style="font-size:13px">Lo que haga sin internet (asistencia, notas, mensajes, encuestas) queda guardado en el dispositivo y se envía solo cuando vuelve la conexión.</p>
  <button onclick="location.reload()">Reintentar</button>
</div>
<script>
  var NAMES={'/app':'Inicio','/app/mi':'Mi portal','/app/credencial':'Mi credencial','/app/docencia':'Mis secciones','/app/aula':'Aula de aprendizaje','/app/calendario':'Calendario','/app/anuncios':'Anuncios','/app/mensajes':'Mensajes','/app/apoderado':'Mis pupilos','/app/encuestas':'Encuestas','/app/biblioteca':'Biblioteca','/app/empleos':'Bolsa de empleo','/app/perfil':'Mi cuenta'};
  caches.open('sematec-pages').then(function(c){return c.keys()}).then(function(keys){
    var box=document.getElementById('pages');
    var paths=keys.map(function(r){return new URL(r.url).pathname}).filter(function(p){return p.indexOf('/app')===0});
    if(!paths.length){box.innerHTML='<p style="font-size:14px">Aún no hay páginas guardadas. Conéctese a internet y abra SEMATEC una vez.</p>';return}
    paths.sort();
    box.innerHTML=paths.map(function(p){return '<a href="'+p+'">'+(NAMES[p]||p.replace('/app/',''))+'</a>'}).join('');
  }).catch(function(){});
  // Recarga solo si de verdad volvió internet (el evento «online» a veces llega sin conexión real)
  window.addEventListener('online',function(){
    fetch('/sw.js?ping='+Date.now(),{cache:'no-store'}).then(function(r){if(r.ok)location.reload()}).catch(function(){});
  });
</script>
</body>
</html>
